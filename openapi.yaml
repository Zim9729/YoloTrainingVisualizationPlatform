openapi: 3.0.3
info:
  title: YOLO Training Visualization Platform API
  version: 1.0.0
  description: |
    REST API for YOLO Training Visualization Platform - A comprehensive tool for dataset management, 
    model training, testing, validation, export, and TCP-based image processing.
    
    ## Modules
    - **IDataset**: Dataset management and Label Studio integration
    - **ITraining**: Training task creation, execution and monitoring
    - **IModel**: Model testing, validation, export and Triton deployment
    - **IImageProcessor**: TCP image processing service integration
    
  contact:
    name: chzane
    email: slxzane@outlook.com
    url: https://github.com/chzane/YoloTrainingVisualizationPlatform
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:10799
    description: Local development server
paths:
  /:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /info:
    get:
      summary: Backend version and info
      responses:
        '200':
          description: Version info
  /IDataset/getAllDatasets:
    get:
      summary: List all datasets
      responses:
        '200':
          description: List of datasets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /IModel/runModelExport:
    post:
      summary: Start a model export (conversion) task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                taskID: { type: string }
                taskName: { type: string }
                outputDir: { type: string, description: Training result directory (ends with result) }
                modelType: { type: string, description: Weight name without extension, e.g., best, last, epoch10 }
                formats:
                  type: array
                  items: { type: string, enum: [onnx, torchscript, openvino, engine] }
                imgsz: { type: integer, default: 640 }
                half: { type: boolean, default: false }
                simplify: { type: boolean, default: false }
                opset: { type: integer, nullable: true }
                device: { type: string, default: cpu }
              required: [taskID, taskName, outputDir]
      responses:
        '200':
          description: Started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /IModel/getExportTaskLog:
    get:
      summary: Get logs for a running export task
      parameters:
        - in: query
          name: exportKey
          schema: { type: string }
          required: true
      responses:
        '200':
          description: Logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /IModel/getExportHistory:
    get:
      summary: Get export history for a training result directory
      parameters:
        - in: query
          name: outputDir
          schema: { type: string }
          required: true
      responses:
        '200':
          description: History list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /IModel/getExportHistoryLog:
    get:
      summary: Get persisted log for a finished export task
      parameters:
        - in: query
          name: outputDir
          schema: { type: string }
          required: true
        - in: query
          name: exportKey
          schema: { type: string }
          required: true
      responses:
        '200':
          description: Log content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /IModel/deleteExportHistory:
    post:
      summary: Delete a single export history entry and its log file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                outputDir: { type: string }
                exportKey: { type: string }
              required: [outputDir, exportKey]
      responses:
        '200':
          description: Delete status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /IModel/listExportArtifacts:
    get:
      summary: List exported artifacts under outputDir/export
      parameters:
        - in: query
          name: outputDir
          schema: { type: string }
          required: true
      responses:
        '200':
          description: File list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /IModel/downloadExportArtifact:
    get:
      summary: Download a specific export artifact file
      parameters:
        - in: query
          name: outputDir
          schema: { type: string }
          required: true
        - in: query
          name: filePath
          schema: { type: string }
          required: true
      responses:
        '200':
          description: File download
          content:
            application/octet-stream: {}
  /IModel/uploadTestInput:
    post:
      summary: Upload a test image to the server and return its saved path
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Upload result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /IDataset/uploadDataset:
    post:
      summary: Upload a dataset archive and register it
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                name:
                  type: string
                description:
                  type: string
                version:
                  type: string
                  example: v1.0.0
                type:
                  type: string
                  description: Dataset type
                  enum: [YOLO, COCO]
                include_yaml:
                  type: string
                  description: '"1" to auto-detect YAML in archive; otherwise provide fields below'
                train:
                  type: string
                val:
                  type: string
                test:
                  type: string
                nc:
                  type: integer
                names:
                  type: string
      responses:
        '200':
          description: Upload status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /IDataset/deleteDataset:
    post:
      summary: Delete a dataset directory by absolute path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
              required: [path]
      responses:
        '200':
          description: Delete status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /ITraining/getAllTasks:
    get:
      summary: List all training task YAMLs
      responses:
        '200':
          description: Task list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /ITraining/getTask:
    get:
      summary: Read a specific task config
      parameters:
        - in: query
          name: filename
          schema: { type: string }
          required: true
      responses:
        '200':
          description: Task config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /ITraining/createTask:
    post:
      summary: Create a training task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                taskName: { type: string }
                taskDescription: { type: string }
                datasetPath: { type: string }
                trainingType: { type: integer, enum: [0,1] }
                baseModelID: { type: string, description: Required when trainingType=0 }
                modelYamlFile: { type: string, description: YAML text when trainingType=1 }
                epochs: { type: integer, default: 100 }
                batchSize: { type: integer, default: 16 }
                imgSize: { type: integer, default: 640 }
                device: { type: string, enum: [cpu, gpu, gpu_idlefirst, mps] }
                gpuCUDAIndex: { type: string }
                gpuCUDANum: { type: integer }
                trainSeed: { type: integer, default: 0 }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /ITraining/deleteTask:
    post:
      summary: Delete a task YAML by relative path under tasks directory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path: { type: string }
              required: [path]
      responses:
        '200':
          description: Delete status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /ITraining/startTask:
    post:
      summary: Start a training task execution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                taskID: { type: string }
                filename: { type: string }
                taskname: { type: string }
              required: [taskID, filename, taskname]
      responses:
        '200':
          description: Started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /ITraining/getTaskLog:
    get:
      summary: Get terminal logs for a running training task
      parameters:
        - in: query
          name: filename
          schema: { type: string }
          required: true
      responses:
        '200':
          description: Logs and running flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /ITraining/getAllRunningTasks:
    get:
      summary: List currently running tasks
      responses:
        '200':
          description: Running tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /ITraining/getTrainingTasksHistory:
    get:
      summary: List history entries for a task
      parameters:
        - in: query
          name: taskID
          schema: { type: string }
          required: true
      responses:
        '200':
          description: History
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /ITraining/getTrainingTaskOutputFile:
    get:
      summary: Read a training output file content or image
      parameters:
        - in: query
          name: taskID
          schema: { type: string }
          required: true
        - in: query
          name: filePath
          schema: { type: string }
          required: true
        - in: query
          name: resultFilePath
          schema: { type: string }
          required: true
      responses:
        '200':
          description: Output file content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /ITraining/getAllBaseModelsFromGithub:
    get:
      summary: Fetch list of base models from GitHub (with cache)
      responses:
        '200':
          description: Model list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /ITraining/getAllBaseModelFromLocal:
    get:
      summary: List base models from local directory
      responses:
        '200':
          description: Local model list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /IModel/runModelTest:
    post:
      summary: Start a model test (inference) task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                taskID: { type: string }
                taskName: { type: string }
                outputDir: { type: string }
                inputType: { type: string, enum: [image, video], default: image }
                inputPath: { type: string }
                modelType: { type: string, enum: [best, last], default: best }
              required: [taskID, taskName, outputDir, inputPath]
      responses:
        '200':
          description: Started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /IModel/getAllTest:
    get:
      summary: List all test tasks for a given training task
      parameters:
        - in: query
          name: taskID
          schema: { type: string }
          required: true
      responses:
        '200':
          description: Test list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /IModel/getTaskLog:
    get:
      summary: Get logs for a running model test task
      parameters:
        - in: query
          name: filename
          schema: { type: string }
          required: true
      responses:
        '200':
          description: Logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /IModel/getAllTrainedModel:
    get:
      summary: List all trained models discovered in training directory
      responses:
        '200':
          description: Trained model inventory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /IModel/runModelValidation:
    post:
      summary: Start a model validation task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                taskID: { type: string }
                taskName: { type: string }
                outputDir: { type: string }
                datasetYamlPath: { type: string }
                modelType: { type: string, enum: [best, last], default: best }
              required: [taskID, taskName, outputDir, datasetYamlPath]
      responses:
        '200':
          description: Started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /IModel/getValTaskLog:
    get:
      summary: Get logs for a running model validation task
      parameters:
        - in: query
          name: filename
          schema: { type: string }
          required: true
      responses:
        '200':
          description: Logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /IModel/getTestResultImageBase64:
    get:
      summary: Get Base64 image of a model test result
      parameters:
        - in: query
          name: taskID
          schema: { type: string }
          required: true
        - in: query
          name: filePath
          schema: { type: string }
          required: true
      responses:
        '200':
          description: Base64 image content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /IModel/getAllValidation:
    get:
      summary: Get all validation tasks for a training task
      parameters:
        - in: query
          name: taskID
          schema: { type: string }
          required: true
      responses:
        '200':
          description: Validation task list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /IModel/getValResultImageBase64:
    get:
      summary: Get Base64 image of validation result (confusion matrix, PR curve, etc.)
      parameters:
        - in: query
          name: taskID
          schema: { type: string }
          required: true
        - in: query
          name: filePath
          schema: { type: string }
          required: true
      responses:
        '200':
          description: Base64 image content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /IModel/downloadValResultFile:
    get:
      summary: Download validation result file
      parameters:
        - in: query
          name: taskID
          schema: { type: string }
          required: true
        - in: query
          name: filePath
          schema: { type: string }
          required: true
      responses:
        '200':
          description: File download
          content:
            application/octet-stream: {}
  /IModel/deleteTestResult:
    post:
      summary: Delete a test result record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filename: { type: string }
              required: [filename]
      responses:
        '200':
          description: Delete status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /IModel/deleteValidationResult:
    post:
      summary: Delete a validation result record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filename: { type: string }
              required: [filename]
      responses:
        '200':
          description: Delete status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /IModel/registerExportArtifactToTriton:
    post:
      summary: Register an exported model to Triton model repository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                outputDir: { type: string }
                filePath: { type: string }
                tritonRepoPath: { type: string }
                tritonModelName: { type: string }
                imgsz: { type: integer, default: 640 }
              required: [outputDir, filePath, tritonRepoPath]
      responses:
        '200':
          description: Registration status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /IModel/listTritonModels:
    get:
      summary: List all models in Triton repository
      parameters:
        - in: query
          name: tritonRepoPath
          schema: { type: string }
          required: true
      responses:
        '200':
          description: Model list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /IModel/deleteTritonModel:
    post:
      summary: Delete a model or model version from Triton repository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tritonRepoPath: { type: string }
                modelName: { type: string }
                version: { type: string, nullable: true }
              required: [tritonRepoPath, modelName]
      responses:
        '200':
          description: Delete status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /IDataset/listLabelStudioProjects:
    get:
      summary: List Label Studio projects
      parameters:
        - in: query
          name: base_url
          schema: { type: string }
          required: true
          description: Label Studio server URL
        - in: query
          name: token
          schema: { type: string }
          required: false
          description: Label Studio API token (optional)
      responses:
        '200':
          description: Project list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /IDataset/buildDatasetFromLabelStudio:
    post:
      summary: Build YOLO dataset from Label Studio project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                base_url: { type: string, description: Label Studio server URL }
                token: { type: string, description: API token (optional) }
                project_id: { type: integer, description: Project ID }
                name: { type: string, description: Dataset name }
                version: { type: string, description: Dataset version }
                description: { type: string }
                exportType: { type: string, default: CSV }
                splits: { type: array, items: { type: number }, example: [0.8, 0.2, 0.0] }
                seed: { type: integer, default: 42 }
                download_images: { type: boolean, default: true }
                class_names: { type: array, items: { type: string }, nullable: true }
              required: [base_url, project_id, name, version]
      responses:
        '200':
          description: Dataset build status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /IImageProcessor/info:
    get:
      tags:
        - IImageProcessor
      summary: Get IImageProcessor module information
      responses:
        '200':
          description: Module info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /IImageProcessor/testConnection:
    get:
      tags:
        - IImageProcessor
      summary: Test TCP service connection
      responses:
        '200':
          description: Connection test result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /IImageProcessor/processImage:
    post:
      tags:
        - IImageProcessor
      summary: Process uploaded image via TCP service
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: Image file to process
                camera_id:
                  type: integer
                  default: 203
                  description: Camera ID
                image_id:
                  type: integer
                  description: Image ID (auto-generated if not provided)
              required: [image]
      responses:
        '200':
          description: Processing result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /IImageProcessor/processDatasetImage:
    post:
      tags:
        - IImageProcessor
      summary: Process image from dataset via TCP service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dataset_path: { type: string }
                image_path: { type: string }
                camera_id: { type: integer, default: 203 }
                image_id: { type: integer }
              required: [dataset_path, image_path]
      responses:
        '200':
          description: Processing result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /IImageProcessor/processFolderImages:
    post:
      tags:
        - IImageProcessor
      summary: Batch process all images in a folder (recursive)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                folder_path: { type: string, description: Folder path to process }
                camera_id: { type: integer, default: 203 }
              required: [folder_path]
      responses:
        '200':
          description: Batch processing results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /IImageProcessor/getFolderImageList:
    post:
      tags:
        - IImageProcessor
      summary: Get list of images in folder (recursive scan)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                folder_path: { type: string }
              required: [folder_path]
      responses:
        '200':
          description: Image file list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /IImageProcessor/getProcessingHistory:
    get:
      tags:
        - IImageProcessor
      summary: Get processing history with pagination
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: page_size
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Processing history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /IImageProcessor/getProcessingStatistics:
    get:
      tags:
        - IImageProcessor
      summary: Get processing statistics (deprecated, use getStatistics)
      responses:
        '200':
          description: Statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /IImageProcessor/getStatistics:
    get:
      tags:
        - IImageProcessor
      summary: Get comprehensive processing statistics
      responses:
        '200':
          description: Comprehensive statistics with daily breakdown and format analysis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /IImageProcessor/getServiceStatus:
    get:
      tags:
        - IImageProcessor
      summary: Get TCP service status
      responses:
        '200':
          description: Service status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /IImageProcessor/deleteProcessingRecord:
    post:
      tags:
        - IImageProcessor
      summary: Delete a single processing record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                record_id: { type: string }
              required: [record_id]
      responses:
        '200':
          description: Delete status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /IImageProcessor/clearProcessingHistory:
    post:
      tags:
        - IImageProcessor
      summary: Clear all processing history
      responses:
        '200':
          description: Clear status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdResponse'
  /IImageProcessor/downloadProcessingResult/{record_id}:
    get:
      tags:
        - IImageProcessor
      summary: Download processing result as JSON
      parameters:
        - in: path
          name: record_id
          schema: { type: string }
          required: true
      responses:
        '200':
          description: JSON file download
          content:
            application/json: {}
  /IImageProcessor/downloadBatchResults:
    post:
      tags:
        - IImageProcessor
      summary: Download multiple processing results as single JSON
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                record_ids: { type: array, items: { type: string } }
              required: [record_ids]
      responses:
        '200':
          description: Batch results JSON file
          content:
            application/json: {}
components:
  schemas:
    StdResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        msg:
          type: string
          example: OK
