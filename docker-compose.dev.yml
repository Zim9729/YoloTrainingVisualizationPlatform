services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: yolo-backend-dev
    ports:
      - "10799:10799"
    volumes:
      # 挂载后端源代码 - 实现热更新
      - ./backend:/app
      # 数据持久化
      - yolo-data:/data
    environment:
      - FLASK_APP=main:app
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - PYTHONUNBUFFERED=1
    # 使用 flask 开发服务器，支持热重载
    command: python -m flask run --host=0.0.0.0 --port=10799 --reload
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:10799/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - yolo-network

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend.dev
    container_name: yolo-frontend-dev
    ports:
      - "80:5173"
    volumes:
      # 挂载前端源代码 - 实现热更新
      - ./frontend:/app
      # 排除 node_modules，使用容器内的
      - /app/node_modules
    environment:
      - NODE_ENV=development
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - yolo-network

networks:
  yolo-network:
    driver: bridge

volumes:
  yolo-data:
